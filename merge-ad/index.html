<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff6df">
  <title>数字二合</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <div class="scene-bg" id="sceneBg" aria-hidden="true"></div>
    <div class="sky-decor decor-one">＋</div><div class="sky-decor decor-two">×2</div>
    <header class="topbar">
      <div class="brand"><span>2</span><b data-config="brand">数字二合</b></div>
      <div class="level-pill">关卡 <b id="levelNumber">1</b>/2</div>
    </header>

    <section class="level-copy">
      <div class="badge" id="levelBadge">轻松教学</div>
      <h1 id="levelTitle">拖动合成数字 4</h1>
      <p id="levelSubtitle">棋盘初始包含两个 1 级、一个 2 级、一个 3 级元素</p>
    </section>

    <section class="goal-card" aria-label="本关目标">
      <span>本关目标</span>
      <div class="goal-list" id="goalList"></div>
    </section>

    <section class="energy-card" id="energyCard" aria-label="篮筐能量">
      <div><span>篮筐能量</span><b id="energyText">20/20</b></div>
      <div class="energy-track"><i id="energyBar"></i></div>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="数字合成棋盘"></div>
      <button class="basket" id="basket" type="button" aria-label="发射 1 级合成元素">
        <span></span>
      </button>
      <div class="finger" id="finger" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 54 68"><path d="M21 34V13c0-5 3-8 7-8s7 3 7 8v16-6c0-4 3-7 7-7s7 3 7 7v18c0 14-8 22-21 22-9 0-15-5-19-13L4 41c-2-4-1-7 3-9 3-2 6-1 9 3l5 7"/></svg>
      </div>
    </section>

    <div class="hint" id="hint"><b>☝</b><span data-config="level1Hint">拖动相同元素叠到一起，依次合成 2、3、4</span></div>

    <div class="transition" id="transition" aria-hidden="true">
      <div class="burst">✦</div><small data-config="transitionKicker">LEVEL UP</small>
      <h2 data-config="transitionTitle">难度飙升</h2>
      <p data-config="transitionSubtitle">更多数字，更大的合成目标！</p>
    </div>

    <div class="finish" id="finish" aria-hidden="true">
      <canvas id="confetti"></canvas>
      <div class="finish-card">
        <div class="trophy">★</div>
        <span data-config="finishBadge">合成大师</span>
        <h2 data-config="finishTitle">挑战成功！</h2>
        <p data-config="finishSubtitle">你完成了两关数字合成</p>
        <button id="replay" type="button"><span data-config="replayText">再玩一次</span> ↻</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
